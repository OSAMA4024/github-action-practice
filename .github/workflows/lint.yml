
name: Auto Linter

on:
  push:
    paths:
      - "**.py"
      - ".github/workflows/**"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Install Linter
        run: pip install ruff

      - name: Run Linter
        run: ruff check . --output-format=github
