
name: Auto Linter

on:
  push:
    paths:
      - "**.py"
     

jobs:
  code-linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Install Linter
        run: pip install ruff

      - name: Run Linter
        run: ruff check . 
